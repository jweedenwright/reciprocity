  <!-- Vue Logic -->
  <script>
    const { createApp, ref, onMounted } = Vue;
    const app = createApp({
      setup() {
        // Reactive State Variables
        const items = ref([]);
        const loading = ref(true);
        const error = ref(null);

        // Async Function to fetch API data
        async function fetchData() {
            loading.value = true;
            error.value = null;
            
            try {
            // Using a real public placeholder API for this example
            /*const response = await fetch('');
            
            if (!response.ok) {
                throw new Error(`HTTP error! Status: ${response.status}`);
            }
            
            items.value = await response.json();
            */
            } catch (err) {
            error.value = `Failed to load data: ${err.message}`;
            } finally {
            loading.value = false;
            }
        }

        function selectUser(name) {
            alert(`You clicked on: ${name}`);
        }

        // Lifecycle Hook: Runs automatically when the page loads
        //onMounted(() => {
        //    fetchData();
        //});

        // Return properties so the HTML template can read them
        return {
            items,
            loading,
            error,
            fetchData,
            selectUser
        };
        }
    });
    
    // Define functions to be used on pages as they load
    app.config.globalProperties.$formatCurrency = function (name) { return `Hello, ${name}!`};

    app.mount('#app');

    // Determine environment
    var config = {
      env: "dev"
      , api: "https://wwcookbook-64210040980.us-east1.run.app/"
    }
    if (window.location.hostname.indexOf('weeden-wright') != -1) {
      config.env = "prod";
      config.api = "https://wwcookbook-64210040980.us-east1.run.app/";
    }
  </script>
