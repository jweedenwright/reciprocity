<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reciprocity - Sharing Recipes Made Easy</title>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" />
  
    <!-- Google Fonts (Roboto) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700,900&display=swap" />
    
    <!-- MDBootstrap CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/9.3.0/mdb.min.css" />
  
    <!-- Vue 3 Global CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.0.5/vue.global.js"></script>

    <!-- Local Styles -->
    <link rel="stylesheet" href="styles/style.css" />
    <link rel="stylesheet" href="styles/github-markdown.css" />

    <!-- Prefetch The other pages -->
     <link rel="prefetch" href="section/cookbook.html" />
     <link rel="prefetch" href="section/groceries.html" />
     <link rel="prefetch" href="section/recipe.html" />
     <link rel="prefetch" href="section/substitutions.html" />
</head>
<body>
  <div id="app">
      <div id="pwa-container">
          <header class="fixed-top bg-white">
              <nav class="navbar p-0 pb-0 ps-3 pe-3">
                  <span class="navbar-text display-6">Reciprocity</span>
                  <div class="btn-group" aria-label="Help Buttons">
                      <button class="btn" tag="a" size="sm" outline="secondary" data-mdb-ripple-init> Text Size </button>
                      <button class="btn" tag="a" size="sm" outline="secondary" color="primary" data-mdb-ripple-init> Cook Mode </button>
                  </div>
              </nav>
          </header>

          <!-- Main Content Container -->
          <main id="main-content">
            <div class="container">
              <div class="card">
                <div class="card-body">
                  <h5 class="card-title">Welcome to Reciprocity</h5>
                  <p class="card-text">lorem ipsum</p>
                </div>
              </div>
            </div>
          </main>
          
          <footer class="fixed-bottom sticky bg-white shadow-lg" :text="['center']" bg="white">
              <!-- Grid container -->
              <div class="container p-2 pb-0">
                  <!-- Section: Pages -->
                  <section class="mb-2">
                  
                      <div class="row align-items-center">

                          <div class="col text-center">
                              <!-- Cookbook -->
                              <a href="#"
                                  class="btn btn-primary m-2 rounded-4" 
                                  style="background-color: #ff8800"
                                  data-route="section/cookbook.html">
                                      <i class="fa fa-book" size="2x"></i>
                              </a>
                          </div>
                          <div class="col text-center">
                              <!-- Grocery List -->
                              <a href="#"
                                  class="btn btn-primary m-2 rounded-4"
                                  style="background-color: #005985"
                                  data-route="section/groceries.html">
                                      <i class="fa fa-carrot" size="2x"></i>
                              </a>
                          </div>
                          <div class="col text-center">
                              <!-- Substitutions -->
                              <a href="#"
                                  class="btn btn-primary m-2 rounded-4"
                                  style="background-color: #446f2b"
                                  data-route="section/substitutions.html">
                                      <i class="fa fa-exchange-alt" size="2x"></i>
                              </a>
                          </div>
                      </div>
                  </section>
                  <!-- Section: Pages -->
              </div>
          </footer>
      </div>
  </div>
    
  <!-- MDBootstrap JavaScript (Required for ripples, dropdowns, etc.) -->
  <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/9.3.0/mdb.umd.min.js"></script>
  <!-- Axios -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/axios@1.19.0/dist/axios.min.js"></script>
  <!-- DOM Purify for injection -->
  <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.4.12/purify.min.js"></script>
  <!-- Local JS -->
  <script type="text/javascript" src="js/router.js"></script>
  <script type="text/javascript" src="js/cookbook.js"></script>

  <!-- Vue Logic -->
  <script>
    const { createApp, ref, onMounted } = Vue;
    
    // Determine environment
    var config = {
      env: "dev"
      , api: "https://wwcookbook-64210040980.us-east1.run.app/"
    }
    if (window.location.hostname.indexOf('weeden-wright') != -1) {
      config.env = "prod";
      config.api = "https://wwcookbook-64210040980.us-east1.run.app/";
    }
    
    // Construct the vue app
    const app = createApp({});
    app.config.globalProperties.$recipes = ref([]);
    app.config.globalProperties.$hasError = ref(false);
    app.config.globalProperties.$isLoading = ref(true);
    // Start the app
    app.mount('#app');
  </script>

</body>
</html>
