  <!-- MDBootstrap JavaScript (Required for ripples, dropdowns, etc.) -->
  <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/9.3.0/mdb.umd.min.js"></script>

  <!-- Local JS -->
  <script type="text/javascript" src="js/router.js"></script>

  <!-- Vue Logic -->
  <script>
    const { createApp, ref, onMounted } = Vue;

    createApp({
      setup() {
        // Reactive State Variables
        const items = ref([]);
        const loading = ref(true);
        const error = ref(null);

        // Async Function to fetch API data
        async function fetchData() {
          loading.value = true;
          error.value = null;
          
          try {
            // Using a real public placeholder API for this example
            /*const response = await fetch('');
            
            if (!response.ok) {
              throw new Error(`HTTP error! Status: ${response.status}`);
            }
            
            items.value = await response.json();
            */
          } catch (err) {
            error.value = `Failed to load data: ${err.message}`;
          } finally {
            loading.value = false;
          }
        }

        function selectUser(name) {
          alert(`You clicked on: ${name}`);
        }

        // Lifecycle Hook: Runs automatically when the page loads
        onMounted(() => {
          fetchData();
        });

        // Return properties so the HTML template can read them
        return {
          items,
          loading,
          error,
          fetchData,
          selectUser
        };
      }
    }).mount('#app');
  </script>
